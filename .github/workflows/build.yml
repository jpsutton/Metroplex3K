name: build

# Builds run only when a change lands on the `build` branch (a merge or push to it).
# Nothing runs for any other branch.
on:
  push:
    branches: [build]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Install SDL2 (macos)
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM3K_BUILD_APP=${{ runner.os == 'Windows' && 'OFF' || 'ON' }}
      - name: Build
        run: cmake --build build --config Release -j
